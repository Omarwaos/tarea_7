<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Línea entre índices - ml5</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>

  <div id="resultados"></div>

  <script>
    let handPose
    let video
    let hands = []

    async function setup() {
      handPose = await ml5.handPose()

      createCanvas(640, 480)

      video = createCapture(VIDEO)
      video.size(640, 480)
      video.hide()

      handPose.detectStart(video, gotHands)
    }

    function draw() {
      image(video, 0, 0, width, height)

      if (hands.length >= 2) {
        let index1 = hands[0].index_finger_tip
        let index2 = hands[1].index_finger_tip

        resultados.innerHTML = `Mano 1: (${Math.round(index1.x)}, ${Math.round(index1.y)}) | Mano 2: (${Math.round(index2.x)}, ${Math.round(index2.y)})`

        // Dibuja la línea entre ambos índices
        stroke(0, 255, 0)
        strokeWeight(4)
        line(index1.x, index1.y, index2.x, index2.y)

        // (Opcional) Puntos en cada punta para marcar los extremos
        fill(255, 0, 0)
        noStroke()
        circle(index1.x, index1.y, 12)
        circle(index2.x, index2.y, 12)
      } else {
        resultados.innerHTML = `Manos detectadas: ${hands.length} (se necesitan 2)`
      }
    }

    function gotHands(results) {
      hands = results
    }
  </script>
</body>
</html>
